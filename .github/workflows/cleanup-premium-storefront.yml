name: Clean premium storefront delivery branch

on:
  push:
    branches:
      - design/premium-hundegodt-storefront
    paths:
      - '.github/workflows/cleanup-premium-storefront.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: design/premium-hundegodt-storefront
          fetch-depth: 0

      - name: Remove temporary delivery workflows
        shell: bash
        run: |
          rm -f .github/workflows/apply-premium-storefront.yml
          rm -f .github/workflows/cleanup-premium-storefront.yml

      - name: Commit clean branch tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary storefront delivery workflows"
          git push origin HEAD:design/premium-hundegodt-storefront
